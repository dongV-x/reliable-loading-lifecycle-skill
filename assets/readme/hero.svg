<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Reliable Loading Lifecycle</title><desc id="desc">请求经过身份、缓存、状态和验证边界，形成可恢复的加载生命周期。</desc>
<rect width="1200" height="320" rx="24" fill="#0B0D10"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<text x="64" y="66" font-size="18" letter-spacing="3" fill="#A7F3D0">SHARED INVARIANTS / FAILURE RECOVERY</text>
<text x="64" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" font-weight="800" fill="#F8FAFC">Reliable Loading</text>
<text x="64" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#CBD5E1">让慢、错、切换和重试都有可追溯的边界。</text>
<text x="64" y="270" font-size="17" fill="#64748B">ADAPT THE STACK · MEASURE THE BOTTLENECK · ENFORCE THE CONTRACT</text></g>
<g transform="translate(700 64)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
