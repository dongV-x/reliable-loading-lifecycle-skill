<g fill="#F8FAFC" font-size="16" text-anchor="middle"><text x="59" y="98">REQUEST</text><text x="213" y="98">IDENTITY</text><text x="367" y="98">CACHE</text><text x="136" y="234">STATE</text><text x="290" y="234">VERIFY</text></g>
